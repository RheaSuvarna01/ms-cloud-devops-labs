services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATA_FILE: /app/data/notes.json
      CORS_ORIGIN: http://localhost:8081
    volumes:
      - notes-data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://localhost:3000
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 10s
      retries: 5

volumes:
  notes-data:
  pg-data:
